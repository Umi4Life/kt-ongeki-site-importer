name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

# Least privilege at the workflow level; only the refresh step below needs write.
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Refuses to write tables that upstream seed schema changes would degrade.
      - run: npm run generate:lookups

      - name: Verify committed lookups match Tachi seeds
        if: github.event_name == 'pull_request'
        run: npm run verify:lookups

      # Runs before the test/typecheck/build steps on purpose. When the refresh
      # ran last, a single failing test stranded master on stale lookups, which
      # then failed this workflow's own verify:lookups gate on every pull
      # request until someone regenerated the file by hand.
      - name: Commit refreshed lookups and bundle
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        run: |
          npm run bundle
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ongeki-importer/config/tachi-chart-lookups.ts docs/
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: refresh Tachi chart lookups"
          git push

      - run: npm test
      - run: npm run typecheck
      - run: npm run build
